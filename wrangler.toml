name = "tenyear-blog"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"

# 文章点赞计数：已创建，直接使用。
[[kv_namespaces]]
binding = "LIKES"
id = "94518aece7f24154ab69aca151501f0e"

# 登录会话与用户数据（收藏 / 阅读记录 / 点赞列表 / 订阅偏好）。
# 先执行：wrangler kv namespace create SESSIONS
# 把返回的 id 填到下面，并取消注释。
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "REPLACE_WITH_SESSIONS_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# 环境变量 / 密钥：不要写在这个文件里，用 wrangler 或 Cloudflare 控制台设置。
# 每个平台缺省时，对应登录入口会自动隐藏，不会出现死链。
#
# OAuth（AUTH_ 前缀，每个平台一组）：
#   AUTH_GITHUB_CLIENT_ID / AUTH_GITHUB_CLIENT_SECRET
#   AUTH_MODRINTH_CLIENT_ID / AUTH_MODRINTH_CLIENT_SECRET
#   AUTH_GOOGLE_CLIENT_ID / AUTH_GOOGLE_CLIENT_SECRET
#   AUTH_DISCORD_CLIENT_ID / AUTH_DISCORD_CLIENT_SECRET
#   AUTH_GITLAB_CLIENT_ID / AUTH_GITLAB_CLIENT_SECRET
#   AUTH_CODEBERG_CLIENT_ID / AUTH_CODEBERG_CLIENT_SECRET
#   AUTH_REDDIT_CLIENT_ID / AUTH_REDDIT_CLIENT_SECRET
#   AUTH_SPOTIFY_CLIENT_ID / AUTH_SPOTIFY_CLIENT_SECRET
#   AUTH_HUGGINGFACE_CLIENT_ID / AUTH_HUGGINGFACE_CLIENT_SECRET
#   AUTH_MASTODON_CLIENT_ID / AUTH_MASTODON_CLIENT_SECRET / AUTH_MASTODON_INSTANCE
#
# 邮箱魔法链接（Resend）：
#   RESEND_API_KEY
#   AUTH_EMAIL_FROM  例如 "S.A <login@your-domain.com>"
#
# Telegram Login Widget：
#   AUTH_TELEGRAM_BOT_TOKEN
#   AUTH_TELEGRAM_BOT_USERNAME  不带 @ 的机器人用户名
#
# 设置方式：
#   wrangler pages secret put AUTH_GITHUB_CLIENT_SECRET --project-name tenyear-blog
# ---------------------------------------------------------------------------
